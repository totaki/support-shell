name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Go modules
        run: go mod tidy
      - name: Check Go module declarations
        run: go mod edit -json >/dev/null
      - name: Go tests with race detection and coverage
        run: |
          set -o pipefail
          go test -race -v -covermode=atomic -coverprofile=coverage.out ./... | tee go-tests.log
          go tool cover -func=coverage.out | tee coverage.txt
      - name: Upload Go coverage to Codecov
        if: success() && github.event_name != 'pull_request'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: go
          name: go-unit-integration
          use_oidc: true
          fail_ci_if_error: false
      - name: Coverage summary
        if: always()
        run: |
          echo "## Go tests and coverage" >> "$GITHUB_STEP_SUMMARY"
          if [ -f go-tests.log ]; then
            echo "Passed test cases: $(grep -c -- '--- PASS:' go-tests.log || true)" >> "$GITHUB_STEP_SUMMARY"
            echo "Failed test cases: $(grep -c -- '--- FAIL:' go-tests.log || true)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s coverage.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'total:|\.go:' coverage.txt | tail -n 25 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage was not generated (tests may have failed)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt
            go-tests.log
          if-no-files-found: ignore
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/support
      - name: Test Extism build tag
        run: go test -tags extism ./...
      - name: Build Extism host
        run: go build -tags extism ./cmd/support

  wasm:
    name: Rust WASM plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugins/sdk
            plugins/diagnostics
            plugins/network
      - name: Test Rust SDK
        run: |
          cargo test --manifest-path plugins/sdk/Cargo.toml
          echo "- Rust SDK tests: passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Build diagnostics WASM
        run: cargo build --manifest-path plugins/diagnostics/Cargo.toml --target wasm32-wasip1 --release
      - name: Test network diagnostics
        run: |
          cargo test --manifest-path plugins/network/Cargo.toml --lib
          echo "- Network diagnostics tests: passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Build network WASM
        run: cargo build --manifest-path plugins/network/Cargo.toml --target wasm32-wasip1 --release
      - name: Build E2E fixture
        run: cargo build --manifest-path plugins/fixture/Cargo.toml --target wasm32-wasip1 --release
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Extism host for E2E
        run: |
          go mod tidy
          go build -tags extism -o support ./cmd/support
      - name: Run MCP WASM E2E
        run: |
          python3 scripts/e2e_mcp.py
          echo "- WASM → Registry → MCP end-to-end: passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify WASM builds
        run: |
          test -s plugins/diagnostics/target/wasm32-wasip1/release/support_diagnostics.wasm
          test -s plugins/network/target/wasm32-wasip1/release/support_network.wasm
